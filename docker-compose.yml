services:

  # ── Reverse proxy (single public port) ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ui
    restart: unless-stopped

  # ── FastAPI pipeline backend ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      RUNS_DIR: /data/runs
      MANIM_BIN: manim
    volumes:
      - runs_data:/data/runs
      - uploads_data:/app/uploads
    restart: unless-stopped

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  ui:
    build:
      context: ./web_ui
      dockerfile: Dockerfile
      args:
        # Empty string → browser calls same-origin /api/*, nginx routes to api
        NEXT_PUBLIC_API_BASE: ""
    restart: unless-stopped

  # ── Coqui XTTS server (optional) ─────────────────────────────────────────────
  # Enable with: docker compose --profile tts up
  tts:
    profiles:
      - tts
    build:
      context: .
      dockerfile: Dockerfile.tts
      args:
        # CPU by default. For CUDA: https://download.pytorch.org/whl/cu121
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    environment:
      # cpu | cuda | mps
      TORCH_DEVICE: ${TORCH_DEVICE:-cpu}
    volumes:
      # Model files (model.pth, config.json, vocab.json, speaker_reference.wav)
      - ./model:/app/model:ro
    restart: unless-stopped

    # ── Uncomment to enable NVIDIA GPU access ────────────────────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  runs_data:
  uploads_data:
